<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代码编辑器 · 在线实时预览</title>
  <style>
    /* 全局重置 & 字体 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1e1e2f;
      font-family: 'Segoe UI', 'Fira Code', 'Menlo', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #d4d4d4;
    }

    /* 顶部工具栏 */
    .toolbar {
      background: #2d2d44;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3d3d5c;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 8px 12px;
    }

    .toolbar h1 {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #b392f0, #6a8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .toolbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background: #3d3d5c;
      border: none;
      color: #e0e0e0;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }

    .btn:hover {
      background: #52527a;
      transform: scale(0.97);
    }

    .btn-primary {
      background: #6a8cff;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #5a7ae8;
    }

    .btn-success {
      background: #2ea97d;
      color: #fff;
    }

    .btn-success:hover {
      background: #24966b;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #5a5a7a;
    }

    .btn-outline:hover {
      background: #3d3d5c;
      border-color: #7a7a9a;
    }

    .lang-badge {
      background: #2a2a42;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      border: 1px solid #4a4a6a;
      color: #b0b0d0;
    }

    /* 编辑器主体：三列布局 */
    .editor-container {
      display: flex;
      flex: 1;
      min-height: 0;  /* flex限制溢出 */
      height: 100%;
      gap: 0;
      background: #1a1a2e;
    }

    /* 每个面板 */
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e1e32;
      border-right: 1px solid #2d2d48;
      min-width: 0;   /* 防止内容溢出 */
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-header {
      background: #252541;
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8888aa;
      border-bottom: 1px solid #323250;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .panel-header .file-name {
      color: #b8b8d0;
      font-weight: 400;
      text-transform: none;
      background: #2a2a48;
      padding: 2px 12px;
      border-radius: 16px;
      font-size: 0.7rem;
    }

    /* 代码编辑区 (textarea) */
    .code-area {
      flex: 1;
      background: #1a1a2e;
      color: #e8e8e8;
      border: none;
      padding: 20px 18px;
      font-family: 'Fira Code', 'Menlo', 'Cascadia Code', monospace;
      font-size: 14px;
      line-height: 1.7;
      resize: none;
      outline: none;
      tab-size: 2;
      width: 100%;
      height: 100%;
      white-space: pre;
      overflow: auto;
    }

    .code-area:focus {
      box-shadow: inset 0 0 0 1px #6a8cff40;
    }

    /* 预览面板 */
    .preview-panel {
      background: #ffffff;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .preview-panel .panel-header {
      background: #2a2a44;
      border-bottom: 1px solid #3a3a5a;
    }

    .preview-frame {
      flex: 1;
      background: #ffffff;
      border: none;
      width: 100%;
      height: 100%;
    }

    /* 响应式: 在窄屏上堆叠 */
    @media (max-width: 820px) {
      .editor-container {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }
      .panel {
        border-right: none;
        border-bottom: 1px solid #2d2d48;
        min-height: 300px;
        flex: 1 1 auto;
      }
      .panel:last-child {
        border-bottom: none;
        min-height: 400px;
      }
      .preview-panel {
        min-height: 400px;
      }
    }

    /* 滚动条样式 (美化) */
    .code-area::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .code-area::-webkit-scrollbar-track {
      background: #1a1a2e;
    }
    .code-area::-webkit-scrollbar-thumb {
      background: #3d3d5c;
      border-radius: 10px;
    }
    .code-area::-webkit-scrollbar-thumb:hover {
      background: #5a5a7a;
    }

    /* 右下角状态 */
    .status-bar {
      background: #1a1a2e;
      padding: 6px 20px;
      font-size: 0.7rem;
      color: #6a6a8a;
      border-top: 1px solid #2d2d44;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .status-bar span {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ea97d;
      margin-right: 6px;
    }

    .dot.warning {
      background: #e6b450;
    }
  </style>
</head>
<body>

  <!-- 工具栏 -->
  <header class="toolbar">
    <h1>⌨️ 代码编辑器</h1>
    <div class="toolbar-actions">
      <span class="lang-badge">HTML / CSS / JS</span>
      <button class="btn btn-success" id="runBtn">▶ 运行</button>
      <button class="btn btn-outline" id="resetBtn">↺ 重置示例</button>
      <button class="btn btn-outline" id="clearBtn">✕ 清空</button>
    </div>
  </header>

  <!-- 编辑器主体 -->
  <div class="editor-container">
    <!-- HTML 面板 -->
    <div class="panel">
      <div class="panel-header">
        <span>📄 HTML</span>
        <span class="file-name">index.html</span>
      </div>
      <textarea class="code-area" id="htmlEditor" spellcheck="false" wrap="off">&lt;div class="card"&gt;
  &lt;h2&gt;✨ 欢迎使用代码编辑器&lt;/h2&gt;
  &lt;p&gt;编辑左侧代码，实时预览效果。&lt;/p&gt;
  &lt;button id="clickBtn"&gt;点击我&lt;/button&gt;
&lt;/div&gt;</textarea>
    </div>

    <!-- CSS 面板 -->
    <div class="panel">
      <div class="panel-header">
        <span>🎨 CSS</span>
        <span class="file-name">style.css</span>
      </div>
      <textarea class="code-area" id="cssEditor" spellcheck="false" wrap="off">body {
  margin: 0;
  background: #f0f4ff;
  font-family: 'Segoe UI', system-ui;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  background: white;
  padding: 2.5rem 3rem;
  border-radius: 32px;
  box-shadow: 0 20px 40px rgba(0, 20, 60, 0.12);
  text-align: center;
  max-width: 440px;
  transition: 0.3s;
  border: 1px solid rgba(255,255,255,0.2);
}

.card h2 {
  color: #1e2a4a;
  font-weight: 600;
  margin-bottom: 12px;
}

.card p {
  color: #3d4a6a;
  line-height: 1.6;
  margin-bottom: 24px;
}

button {
  background: #6a8cff;
  border: none;
  color: white;
  font-weight: 600;
  padding: 12px 28px;
  border-radius: 60px;
  font-size: 1rem;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 4px 10px rgba(106, 140, 255, 0.3);
}

button:hover {
  background: #5a7ae8;
  transform: scale(1.02);
  box-shadow: 0 8px 18px rgba(106, 140, 255, 0.4);
}</textarea>
    </div>

    <!-- JavaScript 面板 -->
    <div class="panel">
      <div class="panel-header">
        <span>⚡ JavaScript</span>
        <span class="file-name">script.js</span>
      </div>
      <textarea class="code-area" id="jsEditor" spellcheck="false" wrap="off">// 交互示例
document.getElementById('clickBtn')?.addEventListener('click', function() {
  const card = document.querySelector('.card');
  card.style.transform = 'scale(0.96)';
  setTimeout(() => card.style.transform = 'scale(1)', 200);
  alert('👋 你好！代码编辑器已就绪。');
});

console.log('✨ 编辑器已加载，开始编码吧！');</textarea>
    </div>

    <!-- 预览面板 -->
    <div class="panel preview-panel">
      <div class="panel-header">
        <span>👁️ 实时预览</span>
        <span class="file-name">output</span>
      </div>
      <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <span><span class="dot"></span> 就绪 · 自动预览</span>
    <span id="charCount">字符: 0</span>
  </div>

  <script>
    (function() {
      // DOM 引用
      const htmlEditor = document.getElementById('htmlEditor');
      const cssEditor = document.getElementById('cssEditor');
      const jsEditor = document.getElementById('jsEditor');
      const previewFrame = document.getElementById('previewFrame');
      const runBtn = document.getElementById('runBtn');
      const resetBtn = document.getElementById('resetBtn');
      const clearBtn = document.getElementById('clearBtn');
      const charCount = document.getElementById('charCount');

      // 默认示例代码 (重置时使用)
      const DEFAULT_HTML = `<div class="card">
  <h2>✨ 欢迎使用代码编辑器</h2>
  <p>编辑左侧代码，实时预览效果。</p>
  <button id="clickBtn">点击我</button>
</div>`;

      const DEFAULT_CSS = `body {
  margin: 0;
  background: #f0f4ff;
  font-family: 'Segoe UI', system-ui;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  background: white;
  padding: 2.5rem 3rem;
  border-radius: 32px;
  box-shadow: 0 20px 40px rgba(0, 20, 60, 0.12);
  text-align: center;
  max-width: 440px;
  transition: 0.3s;
  border: 1px solid rgba(255,255,255,0.2);
}

.card h2 {
  color: #1e2a4a;
  font-weight: 600;
  margin-bottom: 12px;
}

.card p {
  color: #3d4a6a;
  line-height: 1.6;
  margin-bottom: 24px;
}

button {
  background: #6a8cff;
  border: none;
  color: white;
  font-weight: 600;
  padding: 12px 28px;
  border-radius: 60px;
  font-size: 1rem;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 4px 10px rgba(106, 140, 255, 0.3);
}

button:hover {
  background: #5a7ae8;
  transform: scale(1.02);
  box-shadow: 0 8px 18px rgba(106, 140, 255, 0.4);
}`;

      const DEFAULT_JS = `// 交互示例
document.getElementById('clickBtn')?.addEventListener('click', function() {
  const card = document.querySelector('.card');
  card.style.transform = 'scale(0.96)';
  setTimeout(() => card.style.transform = 'scale(1)', 200);
  alert('👋 你好！代码编辑器已就绪。');
});

console.log('✨ 编辑器已加载，开始编码吧！');`;

      // 更新预览 (将三个代码组合成一个 HTML 文档)
      function updatePreview() {
        const html = htmlEditor.value || '';
        const css = cssEditor.value || '';
        const js = jsEditor.value || '';

        // 构建完整的 HTML 文档
        const doc = `
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时预览</title>
  <style>${css}</style>
</head>
<body>
  ${html}
  <script>${js}<\/script>
</body>
</html>`;

        // 写入 iframe
        const iframe = previewFrame;
        if (iframe) {
          try {
            // 使用 srcdoc 更安全简洁
            iframe.srcdoc = doc;
          } catch (e) {
            // fallback: 通过 document.write (但 srcdoc 更优)
            const docWrite = iframe.contentDocument;
            if (docWrite) {
              docWrite.open();
              docWrite.write(doc);
              docWrite.close();
            }
          }
        }

        // 更新字符统计 (合计)
        const totalChars = html.length + css.length + js.length;
        charCount.textContent = `字符: ${totalChars}`;
      }

      // 重置为示例代码
      function resetToDefault() {
        htmlEditor.value = DEFAULT_HTML;
        cssEditor.value = DEFAULT_CSS;
        jsEditor.value = DEFAULT_JS;
        updatePreview();
      }

      // 清空所有编辑器
      function clearAll() {
        htmlEditor.value = '';
        cssEditor.value = '';
        jsEditor.value = '';
        updatePreview();
      }

      // ---------- 事件绑定 ----------
      // 1. 输入时自动更新 (防抖)
      let debounceTimer = null;
      function autoUpdate() {
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          updatePreview();
          debounceTimer = null;
        }, 180);
      }

      htmlEditor.addEventListener('input', autoUpdate);
      cssEditor.addEventListener('input', autoUpdate);
      jsEditor.addEventListener('input', autoUpdate);

      // 2. 点击运行按钮 (立即刷新)
      runBtn.addEventListener('click', updatePreview);

      // 3. 重置示例
      resetBtn.addEventListener('click', resetToDefault);

      // 4. 清空
      clearBtn.addEventListener('click', clearAll);

      // 5. 快捷键：Ctrl+Enter 运行
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          updatePreview();
        }
      });

      // 6. 额外：在编辑器内按 Tab 插入空格 (提升体验)
      function handleTab(e) {
        if (e.key === 'Tab') {
          const textarea = e.target;
          if (textarea && (textarea.classList.contains('code-area'))) {
            e.preventDefault();
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            // 插入两个空格 (或按需)
            textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + 2;
            // 触发 input 事件 (自动更新)
            textarea.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
      }
      document.addEventListener('keydown', handleTab);

      // 7. 初始化预览 (加载默认示例)
      resetToDefault();

      // 额外: 在iframe加载完成后, 如果内部有console.log, 不做特殊处理, 但保持干净
      // 提示: 预览使用 sandbox 允许 scripts, 但不可访问父窗口, 安全隔离.

      // 监听编辑器变化更新字符数 (防抖已经做了, 但额外做一次)
      // 但防抖更新时已经更新字符数, 这里无需再额外绑定.
      // 但为了防止某些场景字符数不准确, 在updatePreview中更新.

      // 手动触发一次字符统计 (已经包含在resetToDefault中)
      console.log('✅ 代码编辑器已启动!');
    })();
  </script>
</body>
</html>
